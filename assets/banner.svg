<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="100%" height="280">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050103" />
      <stop offset="50%" stop-color="#0f0004" />
      <stop offset="100%" stop-color="#050103" />
    </linearGradient>

    <!-- Neon Red Gradient -->
    <linearGradient id="neon-red" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff0033" />
      <stop offset="50%" stop-color="#ff3366" />
      <stop offset="100%" stop-color="#ff0033" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow-red" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glow-subtle" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Cyber Grid Pattern -->
    <pattern id="cyber-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ff0033" stroke-width="0.7" stroke-opacity="0.12" />
    </pattern>
  </defs>

  <style>
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.85; filter: drop-shadow(0 0 15px rgba(255, 0, 51, 0.7)); }
      50% { opacity: 1; filter: drop-shadow(0 0 28px rgba(255, 51, 102, 0.95)); }
    }
    @keyframes scanline {
      0% { transform: translateY(0); }
      100% { transform: translateY(280px); }
    }
    .main-title {
      font-family: 'Fira Code', 'Segoe UI', system-ui, -apple-system, monospace;
      font-weight: 800;
      letter-spacing: 5px;
      animation: pulseGlow 4s ease-in-out infinite;
    }
    .sub-title {
      font-family: 'Fira Code', 'Courier New', monospace;
      font-size: 15px;
      letter-spacing: 3px;
      fill: #ff6688;
    }
    .badge-text {
      font-family: 'Fira Code', monospace;
      font-size: 11px;
      letter-spacing: 1.5px;
      font-weight: 600;
    }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="280" rx="16" fill="url(#bg-grad)" stroke="#ff0033" stroke-width="2" stroke-opacity="0.6" />

  <!-- Cyber Grid Overlay -->
  <rect width="1200" height="280" rx="16" fill="url(#cyber-grid)" />

  <!-- Radial Neon Vignette -->
  <circle cx="600" cy="140" r="380" fill="#ff0033" fill-opacity="0.08" filter="url(#glow-red)" />

  <!-- Top-left Cyber HUD lines -->
  <path d="M 30 50 L 150 50 L 180 80" fill="none" stroke="#ff0033" stroke-width="1.5" stroke-opacity="0.5" />
  <circle cx="30" cy="50" r="3" fill="#ff0033" />
  <circle cx="180" cy="80" r="2.5" fill="#ff3366" />
  <text x="35" y="42" fill="#ff4d73" font-family="monospace" font-size="10" letter-spacing="1">ARCH://NODE.01_SECURE</text>

  <!-- Top-right Cyber HUD lines -->
  <path d="M 1170 50 L 1050 50 L 1020 80" fill="none" stroke="#ff0033" stroke-width="1.5" stroke-opacity="0.5" />
  <circle cx="1170" cy="50" r="3" fill="#ff0033" />
  <circle cx="1020" cy="80" r="2.5" fill="#ff3366" />
  <text x="1055" y="42" fill="#ff4d73" font-family="monospace" font-size="10" letter-spacing="1">STATUS: OPERATIONAL</text>

  <!-- Corner Brackets -->
  <path d="M 16 36 L 16 16 L 36 16" fill="none" stroke="#ff0033" stroke-width="3" />
  <path d="M 1184 36 L 1184 16 L 1164 16" fill="none" stroke="#ff0033" stroke-width="3" />
  <path d="M 16 244 L 16 264 L 36 264" fill="none" stroke="#ff0033" stroke-width="3" />
  <path d="M 1184 244 L 1184 264 L 1164 264" fill="none" stroke="#ff0033" stroke-width="3" />

  <!-- Center Decorative Hex / Diamond -->
  <g transform="translate(600, 48)">
    <polygon points="0,-12 14,0 0,12 -14,0" fill="#ff0033" fill-opacity="0.3" stroke="#ff0033" stroke-width="1.5" />
    <circle cx="0" cy="0" r="3" fill="#ffffff" />
  </g>

  <!-- Main Title: ABDULLAH AL NOMAN -->
  <text x="600" y="112" text-anchor="middle" class="main-title" font-size="44" fill="#ffffff" stroke="#ff0033" stroke-width="1.2">ABDULLAH AL NOMAN</text>

  <!-- Subtitle: Backend Systems Architect -->
  <text x="600" y="148" text-anchor="middle" class="sub-title">⚡ BACKEND SYSTEMS ARCHITECT • PYTHON &amp; DJANGO DEVELOPER ⚡</text>

  <!-- Divider Line with Center Node -->
  <line x1="280" y1="172" x2="520" y2="172" stroke="#ff0033" stroke-width="1.5" stroke-opacity="0.6" />
  <circle cx="525" cy="172" r="3" fill="#ff0033" />
  <polygon points="600,166 606,172 600,178 594,172" fill="#ff3366" />
  <circle cx="675" cy="172" r="3" fill="#ff0033" />
  <line x1="680" y1="172" x2="920" y2="172" stroke="#ff0033" stroke-width="1.5" stroke-opacity="0.6" />

  <!-- Cyber Tech Badges -->
  <g transform="translate(600, 214)">
    <!-- Badge 1: DRF Microservices -->
    <g transform="translate(-370, 0)">
      <rect x="0" y="0" width="165" height="32" rx="6" fill="#140005" stroke="#ff0033" stroke-width="1.2" />
      <circle cx="16" cy="16" r="4" fill="#ff0033" />
      <text x="30" y="20" fill="#ffffff" class="badge-text">REST APIs &amp; DRF</text>
    </g>

    <!-- Badge 2: PostgreSQL Mesh -->
    <g transform="translate(-185, 0)">
      <rect x="0" y="0" width="165" height="32" rx="6" fill="#140005" stroke="#ff0033" stroke-width="1.2" />
      <circle cx="16" cy="16" r="4" fill="#ff3366" />
      <text x="30" y="20" fill="#ffffff" class="badge-text">POSTGRESQL ORM</text>
    </g>

    <!-- Badge 3: Scalable Architecture -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="180" height="32" rx="6" fill="#140005" stroke="#ff0033" stroke-width="1.2" />
      <circle cx="16" cy="16" r="4" fill="#ff0033" />
      <text x="30" y="20" fill="#ffffff" class="badge-text">CLEAN ARCHITECTURE</text>
    </g>

    <!-- Badge 4: Production Security -->
    <g transform="translate(200, 0)">
      <rect x="0" y="0" width="170" height="32" rx="6" fill="#140005" stroke="#ff0033" stroke-width="1.2" />
      <circle cx="16" cy="16" r="4" fill="#00ff66" />
      <text x="30" y="20" fill="#ffffff" class="badge-text">JWT &amp; RBAC AUTH</text>
    </g>
  </g>

  <!-- Bottom Accent Line -->
  <line x1="100" y1="272" x2="1100" y2="272" stroke="#ff0033" stroke-width="1" stroke-opacity="0.3" stroke-dasharray="8 6" />
</svg>

